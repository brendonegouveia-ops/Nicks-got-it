# Cloudflare Pages project config (used by `wrangler pages dev` / `wrangler pages deploy`
# and by Pages Git builds). Build output: dist. Functions: ./functions.
name = "nicks-got-it"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "nicks-got-it"
# Replace with the id printed by `npx wrangler d1 create nicks-got-it`.
database_id = "00000000-0000-0000-0000-000000000000"
